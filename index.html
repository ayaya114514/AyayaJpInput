<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="浏览器里的日语输入法" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AyayaJpInput</title>
  </head>
  <body>
    <main class="app">
      <header class="brand">
        <img src="/favicon.svg" alt="" width="40" height="40" />
        <h1>AyayaJpInput</h1>
      </header>

      <div class="editor" id="editor">
        <label class="sr-only" for="text">日文输入</label>
        <textarea
          id="text"
          class="surface"
          rows="4"
          placeholder="kyouhaiitenkidesu"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          lang="ja"
          autofocus
        ></textarea>
        <div class="surface mirror" id="mirror" lang="ja" aria-hidden="true"></div>
        <div class="candidates" id="candidates" role="listbox" aria-label="候选" lang="ja" hidden></div>
      </div>

      <section class="kana-box" id="kana-box" aria-label="片假名">
        <span class="kana-label">カタカナ</span>
        <div class="kana-text" id="kana" lang="ja" data-placeholder="コーヒー"></div>
      </section>

      <div class="bar">
        <span class="status" id="status" role="status">词典加载中</span>
        <button type="button" class="copy" id="copy">复制</button>
      </div>

    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
