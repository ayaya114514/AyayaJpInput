<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="浏览器里的日语输入法：输入罗马音，边打边出汉字假名候选" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AyayaJpInput</title>
  </head>
  <body>
    <main class="app">
      <header class="brand">
        <img src="/favicon.svg" alt="" width="40" height="40" />
        <h1>AyayaJpInput</h1>
      </header>
      <p class="lead">输入罗马音，下方直接点候选，或按 Space 转换</p>

      <div class="editor" id="editor">
        <label class="sr-only" for="text">日文输入</label>
        <textarea
          id="text"
          class="surface"
          rows="4"
          placeholder="kyouhaiitenkidesu"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          lang="ja"
          autofocus
        ></textarea>
        <div class="surface mirror" id="mirror" lang="ja" aria-hidden="true"></div>
        <div class="candidates" id="candidates" role="listbox" aria-label="候选" lang="ja" hidden></div>
      </div>

      <div class="bar">
        <span class="status" id="status" role="status">词典加载中</span>
        <button type="button" class="copy" id="copy">复制</button>
      </div>

      <p class="hint">
        <kbd>Tab</kbd> 选输入中的候选 · <kbd>=</kbd> 展开候选 · <kbd>Space</kbd> 转换 / 下一个候选 ·
        <kbd>↑</kbd><kbd>↓</kbd> 选候选 · <kbd>←</kbd><kbd>→</kbd> 换文節 ·
        <kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd> 调整文節 · <kbd>Enter</kbd> 确定 · <kbd>Esc</kbd> 取消 ·
        <kbd>F6</kbd> / <kbd>F7</kbd> 平假名 / 片假名
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
